spring:
  datasource:
    url: jdbc:postgresql://pedidos360-db-nano.postgres.database.azure.com:5432/postgres?sslmode=require&tcpKeepAlive=true&socketTimeout=30&connectTimeout=10
    username: adminpedidos
    password: Duoc2026Pedidos
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 60000
      keepalive-time: 30000
      idle-timeout: 30000
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/bb5324af-c266-41ed-b36c-a971641c7af2/v2.0

  # Configuración de Conexión a RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3

logging:
  level:
    org.springframework.security: INFO

# Nombres centralizados de colas y exchanges para RabbitMQ (Requisito EP3)
app:
  rabbitmq:
    queue: pedidos.queue
    exchange: pedidos.exchange
    routing-key: pedidos.routingkey
    dlq: pedidos.dlq
    dlx: pedidos.dlx
    dlx-routing-key: pedidos.dlx.routingkey