spring:
  datasource:
    url: jdbc:postgresql://pedidos360-db-nano.postgres.database.azure.com:5432/postgres?sslmode=require&tcpKeepAlive=true&socketTimeout=30&connectTimeout=10
    username: adminpedidos
    password: Duoc2026Pedidos
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 60000
      keepalive-time: 30000
      idle-timeout: 30000
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/bb5324af-c266-41ed-b36c-a971641c7af2/v2.0

  # Conexión al clúster RabbitMQ (2 nodos): si uno cae, se usa el otro
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5682}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin123}

logging:
  level:
    org.springframework.security: INFO

# Nombres centralizados de exchanges, colas, DLQ y routing keys
app:
  rabbitmq:
    exchanges:
      topic: pedidos.topic
      direct: pedidos.direct
      dlx: pedidos.dlx
    queues:
      notificaciones: notificaciones.queue
      tickets: tickets.queue
      documentos: documentos.queue
    dlqs:
      notificaciones: notificaciones.dlq
      tickets: tickets.dlq
      documentos: documentos.dlq
    routing-keys:
      pedido-creado: pedido.creado          # se publica en el exchange topic
      notificaciones-pattern: "pedido.*"    # binding del topic hacia notificaciones
      tickets: ticket.generar
      documentos: documento.generar
